[project]
name = "airfoil-lny"
version = "0.1.0"
description = "LnY Airfoil Optimization Engine (XFOIL MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "typer>=0.9",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
airfoil-lny = "airfoil_lny.core.optimization.study:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
